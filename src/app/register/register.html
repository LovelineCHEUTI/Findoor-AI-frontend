<!--
  Page Register (inscription).
  Réutilise le même langage visuel que Welcome/Login : fond #070B2A
  identique au fond du logo, accents en dégradé néon.

  [formGroup]="registerForm" relie CE <form> au FormGroup créé dans
  register.ts. Sans cette ligne, Angular ne saurait pas que ce HTML
  correspond à ce formulaire réactif.
-->
<main class="grid min-h-screen place-items-center px-6 py-12">
  <div class="bg-panel w-full max-w-md rounded-2xl border border-line p-8 shadow-2xl">

    <!-- Logo centré en haut de la carte -->
    <div class="mb-6 flex justify-center">
      <img src="/logo-findoor-ai.png" alt="FINDOOR AI" class="h-12 w-auto" />
    </div>

    <h1 class="font-display text-center text-2xl font-medium">
      Créer un compte
    </h1>
    <p class="mt-1 text-center text-sm text-soft">
      Locataire ou propriétaire, rejoignez FINDOOR AI.
    </p>

    <!--
      (ngSubmit) : événement Angular déclenché quand le formulaire est
      soumis (clic sur le bouton submit, ou touche Entrée). On appellera
      la méthode onSubmit() du composant — à ajouter dans register.ts.
    -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-5">

      <!-- Nom complet -->
      <div>
        <label for="nomComplet" class="mb-1.5 block text-sm text-soft">
          Nom complet
        </label>
        <input
          id="nomComplet"
          type="text"
          formControlName="nomComplet"
          placeholder="Ex : Loveline Cheuti"
          class="w-full rounded-md border border-line bg-white/5 px-4 py-2.5 text-sm text-white placeholder:text-faint focus:border-transparent focus:outline focus:outline-2 focus:outline-[color:var(--neon-cyan)]"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="mb-1.5 block text-sm text-soft">
          Email
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="vous@exemple.com"
          class="w-full rounded-md border border-line bg-white/5 px-4 py-2.5 text-sm text-white placeholder:text-faint focus:border-transparent focus:outline focus:outline-2 focus:outline-[color:var(--neon-cyan)]"
        />
      </div>

      <!--
        Mot de passe.
        Le <div class="relative"> sert de repère de positionnement pour le
        bouton œil : "absolute" à l'intérieur d'un parent "relative" veut
        dire "positionné par rapport à CE parent", pas par rapport à toute
        la page.
      -->
      <div>
        <label for="motDePasse" class="mb-1.5 block text-sm text-soft">
          Mot de passe
        </label>
        <div class="relative">
          <input
            id="motDePasse"
            [type]="motDePasseVisible ? 'text' : 'password'"
            formControlName="motDePasse"
            placeholder="8 caractères minimum"
            class="w-full rounded-md border border-line bg-white/5 px-4 py-2.5 pr-11 text-sm text-white placeholder:text-faint focus:border-transparent focus:outline focus:outline-2 focus:outline-[color:var(--neon-cyan)]"
          />
          <!--
            type="button" est important ici : sans lui, un <button> dans un
            <form> se comporte comme un bouton "submit" par défaut, et
            cliquer sur l'œil enverrait le formulaire prématurément.
          -->
          <button
            type="button"
            (click)="basculerMotDePasse()"
            [attr.aria-label]="motDePasseVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            class="text-faint absolute inset-y-0 right-0 flex items-center px-3 hover:text-white"
          >
            <!-- Icône "œil" (visible) -->
            <svg *ngIf="!motDePasseVisible" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <!-- Icône "œil barré" (masqué) -->
            <svg *ngIf="motDePasseVisible" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M3 3l18 18" stroke-linecap="round" />
              <path d="M10.6 5.2C11.05 5.07 11.52 5 12 5c6.5 0 10 7 10 7a17.9 17.9 0 01-3.2 4.2M6.5 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.28 3.6-.75" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9.9 9.9a3 3 0 004.2 4.2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirmation du mot de passe : même principe, bouton séparé -->
      <div>
        <label for="confirmationMotDePasse" class="mb-1.5 block text-sm text-soft">
          Confirmer le mot de passe
        </label>
        <div class="relative">
          <input
            id="confirmationMotDePasse"
            [type]="confirmationVisible ? 'text' : 'password'"
            formControlName="confirmationMotDePasse"
            placeholder="Retapez votre mot de passe"
            class="w-full rounded-md border border-line bg-white/5 px-4 py-2.5 pr-11 text-sm text-white placeholder:text-faint focus:border-transparent focus:outline focus:outline-2 focus:outline-[color:var(--neon-cyan)]"
          />
          <button
            type="button"
            (click)="basculerConfirmation()"
            [attr.aria-label]="confirmationVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            class="text-faint absolute inset-y-0 right-0 flex items-center px-3 hover:text-white"
          >
            <svg *ngIf="!confirmationVisible" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="confirmationVisible" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M3 3l18 18" stroke-linecap="round" />
              <path d="M10.6 5.2C11.05 5.07 11.52 5 12 5c6.5 0 10 7 10 7a17.9 17.9 0 01-3.2 4.2M6.5 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.3 0 2.5-.28 3.6-.75" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9.9 9.9a3 3 0 004.2 4.2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>

      <!--
        Rôle : deux "cartes" cliquables plutôt qu'un <select>, pour que
        le choix locataire/propriétaire soit bien visible (c'est une
        décision définitive à l'inscription).

        Techniquement, ce sont deux vrais <input type="radio"> reliés au
        même formControlName="role" — donc un seul peut être sélectionné
        à la fois, comme pour n'importe quel groupe radio. On les cache
        visuellement (sr-only) et on stylise le <label> associé à la
        place, pour garder l'accessibilité d'un vrai input radio tout en
        ayant un design de carte.
      -->
      <div>
        <span class="mb-1.5 block text-sm text-soft">Je suis...</span>
        <div class="grid grid-cols-2 gap-3">
          <label
            class="has-[:checked]:border-[color:var(--neon-cyan)] has-[:checked]:bg-white/10 cursor-pointer rounded-md border border-line bg-white/5 px-4 py-3 text-center text-sm transition"
          >
            <input type="radio" formControlName="role" value="locataire" class="sr-only" />
            Locataire
          </label>
          <label
            class="has-[:checked]:border-[color:var(--neon-cyan)] has-[:checked]:bg-white/10 cursor-pointer rounded-md border border-line bg-white/5 px-4 py-3 text-center text-sm transition"
          >
            <input type="radio" formControlName="role" value="proprietaire" class="sr-only" />
            Propriétaire
          </label>
        </div>
      </div>

      <!--
        Bouton d'inscription.
        [disabled]="registerForm.invalid" : Angular désactive
        automatiquement le bouton tant que le formulaire n'est pas
        entièrement valide (tous les Validators respectés, mots de passe
        identiques). Pas besoin de vérifier ça "à la main".
      -->
      <button
        type="submit"
        [disabled]="registerForm.invalid"
        class="btn-neon w-full rounded-md py-3 text-sm disabled:cursor-not-allowed disabled:opacity-40"
      >
        Créer mon compte
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-soft">
      Déjà un compte ?
      <a routerLink="/login" class="text-neon-cyan font-medium hover:underline">
        Se connecter
      </a>
    </p>
  </div>
</main>
