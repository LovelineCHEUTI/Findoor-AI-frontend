<div class="min-h-screen bg-gray-50">

  <!-- En-tête : logo + bouton Assistant IA toujours accessible -->
  <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
    <img src="/logo-findoor-ai.png" alt="FINDOOR AI" class="h-10" />

    <button
      (click)="goToAssistant()"
      class="flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-full hover:bg-indigo-700 transition"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8-1.19 0-2.33-.19-3.37-.54L3 21l1.54-4.63C3.56 15.28 3 13.7 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      Assistant IA
    </button>
  </header>

  <!-- Section recherche -->
  <section class="px-6 py-10 text-center">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">
      Trouvez votre prochain logement en toute confiance
    </h1>
    <p class="text-gray-500 mb-6">
      Recherchez par quartier, type de bien ou prix
    </p>

    <!-- [formControl] : property binding qui relie l'input au rechercheControl du composant -->
    <div class="max-w-xl mx-auto flex items-center bg-white rounded-full shadow-md px-4 py-2">
      <input
        type="text"
        [formControl]="rechercheControl"
        (keyup.enter)="onSearch()"
        placeholder="Ex : Studio à Bastos, moins de 50 000 FCFA..."
        class="flex-1 outline-none px-2 py-2 text-gray-700"
      />
      <button
        (click)="onSearch()"
        class="bg-indigo-600 text-white px-5 py-2 rounded-full hover:bg-indigo-700 transition"
      >
        Rechercher
      </button>
    </div>
  </section>

  <!-- Aperçu des annonces (données fictives pour l'instant) -->
  <section class="px-6 pb-12">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Annonces récentes</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- *ngFor boucle sur le tableau, comme *ngIf mais pour répéter un élément -->
      <div
        *ngFor="let annonce of annoncesFictives"
        class="bg-white rounded-xl shadow-sm p-4 hover:shadow-md transition cursor-pointer"
      >
        <!-- Placeholder en dégradé, en attendant les vraies photos uploadées -->
        <div class="h-32 w-full rounded-lg bg-gradient-to-br from-indigo-200 to-indigo-400 mb-3"></div>

        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-medium text-gray-400">{{ annonce.type }}</span>

          <!-- [ngClass] : property binding qui applique dynamiquement des classes CSS -->
          <span
            class="text-xs font-semibold px-2 py-0.5 rounded-full"
            [ngClass]="getBadgeClasses(annonce.scoreConfiance)"
          >
            {{ getBadgeLabel(annonce.scoreConfiance) }}
          </span>
        </div>

        <h3 class="font-semibold text-gray-800 text-sm mb-1">{{ annonce.titre }}</h3>
        <p class="text-xs text-gray-500 mb-2">{{ annonce.quartier }}</p>
        <p class="text-indigo-600 font-bold text-sm">{{ annonce.prix | number }} FCFA / mois</p>
      </div>
    </div>
  </section>

</div>
